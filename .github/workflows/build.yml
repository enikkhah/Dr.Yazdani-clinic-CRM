name: Build Android Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Release APK with Capacitor
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Clean Extra Assets and Build Web Assets (dist)
        run: |
          rm -f public/assets/aistudio/Screenshot*
          npm run build

      - name: Remove old Android folder and Add Capacitor Android Platform
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Set Custom App Icon for Android Mipmaps
        run: |
          ICON_SRC="public/assets/aistudio/1794122480792_5bfe6c5e.png"
          if [ -f "$ICON_SRC" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for dir in android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
              if [ -d "$dir" ]; then
                rm -f "$dir"/ic_launcher*.webp
                cp "$ICON_SRC" "$dir/ic_launcher.png"
                cp "$ICON_SRC" "$dir/ic_launcher_round.png"
                cp "$ICON_SRC" "$dir/ic_launcher_foreground.png"
              fi
            done
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate Release Keystore and Configure Release Signing
        working-directory: android
        run: |
          keytool -genkey -v -keystore app/release.keystore -alias dryazdani_release -keyalg RSA -keysize 2048 -validity 10000 -storepass dryazdani123456 -keypass dryazdani123456 -dname "CN=DrYazdani, OU=Clinic, O=NarvanTeam, L=Isfahan, C=IR"
          python3 - <<'PY'
          from pathlib import Path
          gradle_file = Path("app/build.gradle")
          if gradle_file.exists():
              content = gradle_file.read_text()
              signing_block = """
              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'dryazdani123456'
                      keyAlias 'dryazdani_release'
                      keyPassword 'dryazdani123456'
                  }
              }
          """
              if "signingConfigs {" not in content:
                  content = content.replace("defaultConfig {", signing_block + "\n    defaultConfig {")
              old_release_block = """release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }"""
              new_release_block = """release {
            signingConfig signingConfigs.release
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }"""
              if old_release_block in content:
                  content = content.replace(old_release_block, new_release_block)
              elif "release {" in content and "signingConfig" not in content:
                  content = content.replace("release {", "release {\n            signingConfig signingConfigs.release\n            debuggable false")
              gradle_file.write_text(content)
          PY

      - name: Grant Execute Permission for Gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build Signed Release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/release/*.apk ../dist-apk/Dr-Yazdani-CRM-release.apk

      - name: Upload Generated Release APK Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Dr-Yazdani-CRM-Release-APK
          path: dist-apk/Dr-Yazdani-CRM-release.apk
          if-no-files-found: error
          overwrite: true
