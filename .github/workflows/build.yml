name: Build Android Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Release APK with Capacitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Clean Extra Assets and Build Web Assets (dist)
        run: |
          rm -f public/assets/aistudio/Screenshot*
          npm run build

      - name: Add and Sync Capacitor Android Platform
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Bypass GitHub Gradle 504 Outage via Local Mirror Download
        run: |
          curl -fL --retry 5 -o /tmp/gradle-8.2.1-bin.zip "https://mirrors.cloud.tencent.com/gradle/gradle-8.2.1-bin.zip" || \
          curl -fL --retry 5 -o /tmp/gradle-8.2.1-bin.zip "https://mirrors.aliyun.com/macports/distfiles/gradle/gradle-8.2.1-bin.zip" || \
          curl -fL --retry 5 -o /tmp/gradle-8.2.1-bin.zip "https://services.gradle.org/distributions/gradle-8.2.1-bin.zip"
          sed -i 's|distributionUrl=.*|distributionUrl=file\\:///tmp/gradle-8.2.1-bin.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=10000/networkTimeout=120000/g' android/gradle/wrapper/gradle-wrapper.properties

      - name: Set Custom App Icon for Android APK
        run: |
          ICON_SRC="public/assets/aistudio/1794122480792_5bfe6c5e.png"
          if [ -f "$ICON_SRC" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for dir in android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
              if [ -d "$dir" ]; then
                rm -f "$dir"/ic_launcher*.webp
                cp "$ICON_SRC" "$dir/ic_launcher.png"
                cp "$ICON_SRC" "$dir/ic_launcher_round.png"
                cp "$ICON_SRC" "$dir/ic_launcher_foreground.png"
              fi
            done
          fi

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate Release Keystore and Configure Release Signing
        working-directory: ./android
        run: |
          keytool -genkey -v -keystore app/release.keystore -alias drizady_release -keyalg RSA -keysize 2048 -validity 10000 -storepass drizady123456 -keypass drizady123456 -dname "CN=DrIzady, OU=Clinic, O=NarvanTeam, L=Isfahan, C=IR"
          node -e '
            const fs = require("fs");
            let content = fs.readFileSync("app/build.gradle", "utf8");
            const signingBlock = `    lint {\n        checkReleaseBuilds false\n        abortOnError false\n    }\n    signingConfigs {\n        release {\n            storeFile file("release.keystore")\n            storePassword "drizady123456"\n            keyAlias "drizady_release"\n            keyPassword "drizady123456"\n        }\n    }\n    `;
            content = content.replace("defaultConfig {", signingBlock + "defaultConfig {");
            content = content.replace("release {", "release {\n            signingConfig signingConfigs.release\n            debuggable false");
            fs.writeFileSync("app/build.gradle", content, "utf8");
          '

      - name: Grant Execute Permission for Gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build Signed Release APK
        working-directory: ./android
        run: |
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../dist-apk
          cp app/build/outputs/apk/release/*.apk ../dist-apk/Dr-Izady-CRM-release.apk

      - name: Upload Generated Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dr-Izady-CRM-Release-APK
          path: dist-apk/Dr-Izady-CRM-release.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" dist-apk/Dr-Izady-CRM-release.apk --title "Dr Izady CRM $TAG" --notes "نسخه نهایی و امضاشده اپلیکیشن مدیریت بیماران دکتر علیرضا ایزدی ($TAG)" || \
          gh release upload "$TAG" dist-apk/Dr-Izady-CRM-release.apk --clobber
