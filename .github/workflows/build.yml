name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK with Capacitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Clean Extra Assets and Build Web Assets (dist)
        run: |
          rm -f public/assets/aistudio/Screenshot*
          npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Add and Sync Capacitor Android Platform
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Set Custom App Icon for Android APK
        run: |
          ICON_SRC="public/assets/aistudio/1794122480792_5bfe6c5e.png"
          if [ -f "$ICON_SRC" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for dir in android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
              if [ -d "$dir" ]; then
                rm -f "$dir"/ic_launcher*.webp
                cp "$ICON_SRC" "$dir/ic_launcher.png"
                cp "$ICON_SRC" "$dir/ic_launcher_round.png"
                cp "$ICON_SRC" "$dir/ic_launcher_foreground.png"
              fi
            done
          fi

      - name: Grant Execute Permission for Gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload Generated APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dr-Izady-CRM-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
