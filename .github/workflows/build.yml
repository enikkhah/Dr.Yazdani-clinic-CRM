name: Build Android Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Signed Release APK with Capacitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Clean Extra Assets and Build Web Assets (dist)
        run: |
          rm -f public/assets/aistudio/Screenshot*
          npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Add and Sync Capacitor Android Platform
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Set Custom App Icon for Android Mipmaps
        run: |
          ICON_SRC="public/assets/aistudio/1794122480792_5bfe6c5e.png"
          if [ -f "$ICON_SRC" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for dir in android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
              if [ -d "$dir" ]; then
                cp "$ICON_SRC" "$dir/ic_launcher.png"
                cp "$ICON_SRC" "$dir/ic_launcher_round.png"
                cp "$ICON_SRC" "$dir/ic_launcher_foreground.png"
              fi
            done
          fi

      - name: Configure Signed Release Build and R8 Resource Shrinking
        run: |
          echo "" | base64 -d > android/app/release.p12
          node -e '
            const fs = require("fs");
            let content = fs.readFileSync("android/app/build.gradle", "utf8");
            const target = `    buildTypes {\n        release {\n            minifyEnabled false\n            proguardFiles getDefaultProguardFile(\x27proguard-android.txt\x27), \x27proguard-rules.pro\x27\n        }\n    }`;
            const replacement = `    signingConfigs {\n        release {\n            storeFile file("release.p12")\n            storePassword "dryazdani123456"\n            keyAlias "dryazdani"\n            keyPassword "dryazdani123456"\n        }\n    }\n    buildTypes {\n        release {\n            signingConfig signingConfigs.release\n            minifyEnabled true\n            shrinkResources true\n            proguardFiles getDefaultProguardFile(\x27proguard-android-optimize.txt\x27), \x27proguard-rules.pro\x27\n        }\n    }`;
            content = content.replace(target, replacement);
            fs.writeFileSync("android/app/build.gradle", content, "utf8");
          '

      - name: Grant Execute Permission for Gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build Signed Release APK
        working-directory: ./android
        run: ./gradlew assembleRelease

      - name: Upload Generated Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dr-Yazdani-CRM-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
